name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Type Check & Linting
        run: npm run lint

      - name: Run Deterministic Pricing Engine Unit Tests
        run: npm test

      - name: Run Security & Authorization Test Suite
        run: npm run test:security

      - name: Compile Application (Vite SPA + Server Bundle)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Health Check Route Compilation
        run: |
          test -f dist/server.cjs || (echo "Server bundle missing" && exit 1)
          test -f dist/index.html || (echo "Vite SPA index missing" && exit 1)
          echo "All builds verified successfully!"
