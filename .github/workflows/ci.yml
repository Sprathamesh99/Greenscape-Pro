name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Type Check & Linting
        run: npm run lint

      - name: Run Deterministic Pricing Engine Unit Tests
        run: npm test

      - name: Run Security & Authorization Test Suite
        run: npm run test:security

      - name: Compile Application (Vite SPA + Server Bundle)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Health Check Route Compilation
        run: |
          test -f dist/server.cjs || (echo "Server bundle missing" && exit 1)
          test -f dist/index.html || (echo "Vite SPA index missing" && exit 1)

      - name: Security Vulnerability Scan (Production Dependencies)
        run: npm audit --audit-level=high --production
        continue-on-error: true
